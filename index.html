<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おちゃこAI（ブラウザ版）</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", sans-serif; background:#f7f5f2; color:#1f1e1c; }
  header { padding:14px 16px; background:#fff; border-bottom:1px solid #e5e1da; font-weight:700; display:flex; align-items:center; gap:10px; }
  #newchat { margin-left:auto; padding:9px 14px; border-radius:999px; border:1px solid #cfc9bf; background:#fff; font-size:14px; font-weight:400; cursor:pointer; font-family:inherit; }
  #newchat:active { background:#f0ede6; }
  header small { display:block; font-weight:400; color:#6b675f; margin-top:2px; }
  #setup { max-width:760px; margin:16px auto 0; padding:16px; background:#fff; border:1px solid #e5e1da; border-radius:14px; }
  #setup h2 { margin:0 0 8px; font-size:16px; }
  #setup p { margin:6px 0; font-size:14px; color:#44413c; line-height:1.6; }
  .opt { display:block; padding:10px 12px; border:1px solid #cfc9bf; border-radius:12px; margin:8px 0; cursor:pointer; font-size:15px; }
  .opt small { display:block; color:#6b675f; margin-top:2px; font-size:13px; }
  .opt:has(input:checked) { border-color:#2f6f4f; background:#eef5f0; }
  #start { padding:12px 24px; border-radius:12px; border:0; background:#2f6f4f; color:#fff; font-size:16px; margin-top:8px; }
  #start:disabled { opacity:.5; }
  #delcache { padding:8px 14px; border-radius:10px; border:1px solid #cfc9bf; background:#fff; font-size:13px; margin-left:8px; display:none; }
  #setupStatus { margin-top:10px; font-size:13px; color:#6b675f; }
  #log { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.6; max-width:85%; }
  .user { background:#e8f0e9; align-self:flex-end; }
  .bot { background:#fff; border:1px solid #e5e1da; align-self:flex-start; }
  #bar { position:sticky; bottom:0; background:#f7f5f2; padding:12px 16px; }
  #bar div { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  #inp { flex:1; padding:12px; border-radius:12px; border:1px solid #cfc9bf; font-size:16px; }
  #send { padding:12px 20px; border-radius:12px; border:0; background:#2f6f4f; color:#fff; font-size:16px; }
  #send.stop { background:#b0483a; }
  #send:disabled { opacity:.5; }

  #settings { max-width:760px; margin:12px auto 0; padding:16px; background:#fff; border:1px solid #e5e1da; border-radius:14px; display:none; }
  #settings.open { display:block; }
  #settings h2 { margin:0 0 6px; font-size:16px; }
  #settings .row { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px; }
  #settings .row label { width:150px; flex:none; }
  #settings .row input[type=range] { flex:1; }
  #settings .row .val { width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  #settings .note { font-size:12px; color:#6b675f; }
  #settings button { padding:9px 14px; border-radius:10px; border:1px solid #cfc9bf; background:#fff; font-size:14px; cursor:pointer; font-family:inherit; margin-right:8px; }
  #gear { padding:9px 14px; border-radius:999px; border:1px solid #cfc9bf; background:#fff; font-size:14px; font-weight:400; cursor:pointer; font-family:inherit; }
  #status { max-width:760px; margin:8px auto 0; font-size:13px; color:#6b675f; }
</style>
</head>
<body>
<header><div>おちゃこAI（ブラウザ版）<small>自作Transformer（約6,360万パラメータ）をブラウザ上だけで動かしています。step 189,910 / デコード条件 B1.5</small></div><button id="newchat">＋ 新しいチャット</button><button id="gear">⚙ 設定</button></header>

<div id="setup">
  <h2>モデルの読み込み方法</h2>
  <p>モデルは約258MBあります。読み込み方法を選んでから「読み込み開始」を押してください。</p>
  <label class="opt"><input type="radio" name="mode" value="cache" checked> ブラウザに保存して使う
    <small>初回だけダウンロードして、この端末のブラウザに保存します。次回からはダウンロードなしで、すぐ使えます。機内モードでも開けます。</small></label>
  <label class="opt"><input type="radio" name="mode" value="fresh"> 毎回ダウンロードする
    <small>保存はしません。開くたびに約258MBをダウンロードします。</small></label>
  <button id="start">読み込み開始</button>
  <button id="delcache">保存済みモデルを削除</button>
  <div id="setupStatus"></div>
</div>


<div id="settings">
  <h2>生成の設定</h2>
  <div class="row"><label>温度（ランダムさ）</label><input type="range" id="set-temp" min="0.1" max="1.5" step="0.05"><span class="val" id="val-temp"></span></div>
  <div class="row"><label>top_k（候補の数）</label><input type="range" id="set-topk" min="1" max="100" step="1"><span class="val" id="val-topk"></span></div>
  <div class="row"><label>繰り返しペナルティ</label><input type="range" id="set-rep" min="1" max="1.5" step="0.01"><span class="val" id="val-rep"></span></div>
  <div class="row"><label>最大トークン数</label><input type="range" id="set-maxnew" min="10" max="300" step="5"><span class="val" id="val-maxnew"></span></div>
  <div class="row"><label>CPUコア数（スレッド）</label><input type="range" id="set-threads" min="1" max="8" step="1"><span class="val" id="val-threads"></span></div>
  <p class="note">温度・top_k・ペナルティ・最大トークンはすぐ反映されます。CPUコア数は「エンジンを再起動」で反映されます（実測では1が最速でした）。設定はこの端末に保存されます。</p>
  <button id="set-reset">標準（B1.5）に戻す</button>
  <button id="set-restart">エンジンを再起動</button>
</div>

<div id="log"></div>
<div id="bar"><div>
  <input id="inp" placeholder="メッセージを入力" autocomplete="off">
  <button id="send" disabled>送信</button>
</div><div id="status"></div></div>

<script>
// オフライン対応：アプリの殻をサービスワーカーでキャッシュする（機内モードでも開けるように）
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
<script>
// ===== 設定 =====
// モデルは Hugging Face 上の単一ファイル model.onnx を URL で読み込む。
// 推論は Web Worker で実行する（画面が固まらないように）。
const MODEL_URL = "https://huggingface.co/tamasann/ochako-v3/resolve/main/model.onnx";
const ORT_BASE = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";
const CACHE_NAME = "ochako-model-v1";
const VOCAB_URL = "vocab.json";

let itos = [], worker = null, workerReady = false, loadMode = "cache";
let history = [];
let generating = false, currentResolve = null, currentBubble = null, genTimer = null;
const logEl = document.getElementById('log'), inp = document.getElementById('inp'),
      sendBtn = document.getElementById('send'), statusEl = document.getElementById('status'),
      setupEl = document.getElementById('setup'), setupStatusEl = document.getElementById('setupStatus'),
      startBtn = document.getElementById('start'), delBtn = document.getElementById('delcache');

function addMsg(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  logEl.appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d;
}

async function downloadWithProgress() {
  const r = await fetch(MODEL_URL);
  if (!r.ok) throw new Error("モデルの取得に失敗しました (" + r.status + ")");
  const total = Number(r.headers.get("Content-Length")) || 270367948;
  const reader = r.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    setupStatusEl.textContent = `ダウンロード中… ${(got / 1048576).toFixed(0)}MB / ${(total / 1048576).toFixed(0)}MB`;
  }
  const merged = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { merged.set(c, off); off += c.length; }
  return merged;
}

async function loadModelBytes() {
  if (loadMode === "cache" && "caches" in window) {
    const cache = await caches.open(CACHE_NAME);
    const hit = await cache.match(MODEL_URL);
    if (hit) {
      setupStatusEl.textContent = "保存済みモデルを使います（ダウンロードなし）";
      return new Uint8Array(await hit.arrayBuffer());
    }
    const bytes = await downloadWithProgress();
    try {
      await cache.put(MODEL_URL, new Response(bytes, { headers: { "Content-Type": "application/octet-stream" } }));
      setupStatusEl.textContent = "保存しました。次回からはダウンロードなしで使えます。";
    } catch (e) {
      setupStatusEl.textContent = "保存はできませんでしたが、今回はこのまま使えます。（端末の空き容量不足の可能性があります）";
    }
    return bytes;
  }
  return downloadWithProgress();
}

async function startWorker() {
  const bytes = await loadModelBytes();
  setupStatusEl.textContent = "モデルを準備しています…";
  if (worker) worker.terminate();
  worker = new Worker("worker.js");
  workerReady = false;
  await new Promise((resolve, reject) => {
    const onMsg = (e) => {
      if (e.data.type === 'ready') { worker.removeEventListener('message', onMsg); workerReady = true; resolve(); }
      else if (e.data.type === 'error' && !e.data.id) { worker.removeEventListener('message', onMsg); reject(new Error(e.data.message)); }
    };
    worker.addEventListener('message', onMsg);
    worker.postMessage({ type: 'init', ortBase: ORT_BASE, itos, cfg: settings, modelBytes: bytes.buffer }, [bytes.buffer]);
  });
  worker.addEventListener('message', onWorkerMessage);
}

function onWorkerMessage(e) {
  const m = e.data;
  if (m.type === 'token' && currentBubble) {
    currentBubble.textContent = m.text;
    window.scrollTo(0, document.body.scrollHeight);
  } else if (m.type === 'done' && currentResolve) {
    const r = currentResolve; currentResolve = null;
    r(m.text);
  } else if (m.type === 'error' && currentResolve) {
    const r = currentResolve; currentResolve = null;
    r(null, new Error(m.message));
  }
}

async function refreshCacheUI() {
  if (!("caches" in window)) return;
  const cache = await caches.open(CACHE_NAME);
  const hit = await cache.match(MODEL_URL);
  if (hit) {
    setupStatusEl.textContent = "この端末に保存済みのモデルがあります。「ブラウザに保存して使う」のままで開始すると、ダウンロードなしで使えます。";
    delBtn.style.display = "inline-block";
  } else {
    delBtn.style.display = "none";
  }
}
delBtn.onclick = async () => {
  await caches.delete(CACHE_NAME);
  setupStatusEl.textContent = "保存済みモデルを削除しました。";
  delBtn.style.display = "none";
};

let started = false;
startBtn.onclick = async () => {
  if (started) return; started = true; startBtn.disabled = true;
  loadMode = document.querySelector('input[name="mode"]:checked').value;
  try {
    const v = await (await fetch(VOCAB_URL)).json();
    itos = v.itos;
    await startWorker();
    setupEl.style.display = "none";
    statusEl.textContent = '準備できました。話しかけてみてください。';
    sendBtn.disabled = false; inp.focus();
  } catch (e) {
    setupStatusEl.textContent = '読み込みに失敗しました: ' + e.message;
    started = false; startBtn.disabled = false;
  }
};
refreshCacheUI();

// ===== 生成の設定（端末に保存） =====
const SETTING_DEFAULTS = { temperature: 0.65, topK: 40, repPenalty: 1.15, maxNew: 150, threads: 1 };
function loadSettings() {
  try { return { ...SETTING_DEFAULTS, ...JSON.parse(localStorage.getItem('ochako-settings') || '{}') }; }
  catch (e) { return { ...SETTING_DEFAULTS }; }
}
let settings = loadSettings();
function saveSettings() { try { localStorage.setItem('ochako-settings', JSON.stringify(settings)); } catch (e) {} }
function pushConfig() { if (worker) worker.postMessage({ type: 'config', cfg: settings }); }
function syncSettingUI() {
  const map = { temp: 'temperature', topk: 'topK', rep: 'repPenalty', maxnew: 'maxNew', threads: 'threads' };
  for (const [id, key] of Object.entries(map)) {
    const el = document.getElementById('set-' + id), val = document.getElementById('val-' + id);
    if (!el) continue;
    el.value = settings[key]; val.textContent = settings[key];
    el.oninput = () => {
      settings[key] = Number(el.value); val.textContent = el.value;
      saveSettings(); pushConfig();
    };
  }
}
document.getElementById('gear').onclick = () => document.getElementById('settings').classList.toggle('open');
document.getElementById('set-reset').onclick = () => { settings = { ...SETTING_DEFAULTS }; saveSettings(); syncSettingUI(); pushConfig(); };
syncSettingUI();

document.getElementById('set-restart').onclick = async () => {
  if (generating || !started) return;
  sendBtn.disabled = true; statusEl.textContent = 'エンジンを再起動しています…';
  try { await startWorker(); statusEl.textContent = '準備できました。話しかけてみてください。'; }
  catch (e) { statusEl.textContent = '再起動に失敗しました: ' + e.message; }
  sendBtn.disabled = false;
};


function setGenerating(on, bubble) {
  generating = on; currentBubble = bubble || null;
  if (on) {
    sendBtn.disabled = false; sendBtn.textContent = '停止'; sendBtn.classList.add('stop');
    const t0 = Date.now();
    statusEl.textContent = '考え中… 0秒';
    genTimer = setInterval(() => { statusEl.textContent = `考え中… ${Math.floor((Date.now() - t0) / 1000)}秒`; }, 500);
  } else {
    sendBtn.textContent = '送信'; sendBtn.classList.remove('stop');
    statusEl.textContent = '';
    clearInterval(genTimer);
  }
}

async function doSend() {
  const text = inp.value.trim(); if (!text || !workerReady || generating) return;
  inp.value = ''; addMsg(text, 'user');
  history.push({ role: 'user', text });
  const bubble = addMsg('考え中…', 'bot');
  setGenerating(true, bubble);
  try {
    const out = await new Promise((resolve, reject) => {
      currentResolve = (t, err) => err ? reject(err) : resolve(t);
      worker.postMessage({ type: 'generate', id: 1, history });
    });
    bubble.textContent = out || '（応答が生成できませんでした）';
    if (out) history.push({ role: 'assistant', text: out });
  } catch (e) { bubble.textContent = 'エラー: ' + e.message; history.pop(); }
  setGenerating(false);
  inp.focus();
}

async function doStop() {
  if (!generating) return;
  if (currentBubble) currentBubble.textContent += '（停止しました）';
  currentResolve = null;
  setGenerating(false);
  statusEl.textContent = '再準備しています…';
  sendBtn.disabled = true;
  try { await startWorker(); statusEl.textContent = '準備できました。'; }
  catch (e) { statusEl.textContent = '再準備に失敗しました: ' + e.message; }
  sendBtn.disabled = false;
}

sendBtn.onclick = () => { if (generating) doStop(); else doSend(); };
document.getElementById('newchat').onclick = () => {
  if (generating) return;
  history = []; logEl.innerHTML = '';
  statusEl.textContent = '新しいチャットを始めました。話しかけてみてください。';
  inp.focus();
};
inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.onclick(); });
</script>
</body>
</html>
