<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おちゃこAI（ブラウザ版）</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", sans-serif; background:#f7f5f2; color:#1f1e1c; }
  header { padding:14px 16px; background:#fff; border-bottom:1px solid #e5e1da; font-weight:700; }
  header small { display:block; font-weight:400; color:#6b675f; margin-top:2px; }
  #setup { max-width:760px; margin:16px auto 0; padding:16px; background:#fff; border:1px solid #e5e1da; border-radius:14px; }
  #setup h2 { margin:0 0 8px; font-size:16px; }
  #setup p { margin:6px 0; font-size:14px; color:#44413c; line-height:1.6; }
  .opt { display:block; padding:10px 12px; border:1px solid #cfc9bf; border-radius:12px; margin:8px 0; cursor:pointer; font-size:15px; }
  .opt small { display:block; color:#6b675f; margin-top:2px; font-size:13px; }
  .opt:has(input:checked) { border-color:#2f6f4f; background:#eef5f0; }
  #start { padding:12px 24px; border-radius:12px; border:0; background:#2f6f4f; color:#fff; font-size:16px; margin-top:8px; }
  #start:disabled { opacity:.5; }
  #delcache { padding:8px 14px; border-radius:10px; border:1px solid #cfc9bf; background:#fff; font-size:13px; margin-left:8px; display:none; }
  #setupStatus { margin-top:10px; font-size:13px; color:#6b675f; }
  #log { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.6; max-width:85%; }
  .user { background:#e8f0e9; align-self:flex-end; }
  .bot { background:#fff; border:1px solid #e5e1da; align-self:flex-start; }
  #bar { position:sticky; bottom:0; background:#f7f5f2; padding:12px 16px; }
  #bar div { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  #inp { flex:1; padding:12px; border-radius:12px; border:1px solid #cfc9bf; font-size:16px; }
  #send { padding:12px 20px; border-radius:12px; border:0; background:#2f6f4f; color:#fff; font-size:16px; }
  #send:disabled { opacity:.5; }
  #status { max-width:760px; margin:8px auto 0; font-size:13px; color:#6b675f; }
</style>
</head>
<body>
<header>おちゃこAI（ブラウザ版）<small>自作Transformer（約6,360万パラメータ）をブラウザ上だけで動かしています。step 189,910 / デコード条件 B1.5</small></header>

<div id="setup">
  <h2>モデルの読み込み方法</h2>
  <p>モデルは約258MBあります。読み込み方法を選んでから「読み込み開始」を押してください。</p>
  <label class="opt"><input type="radio" name="mode" value="cache" checked> ブラウザに保存して使う
    <small>初回だけダウンロードして、この端末のブラウザに保存します。次回からはダウンロードなしで、すぐ使えます。</small></label>
  <label class="opt"><input type="radio" name="mode" value="fresh"> 毎回ダウンロードする
    <small>保存はしません。開くたびに約258MBをダウンロードします。</small></label>
  <button id="start">読み込み開始</button>
  <button id="delcache">保存済みモデルを削除</button>
  <div id="setupStatus"></div>
</div>

<div id="log"></div>
<div id="bar"><div>
  <input id="inp" placeholder="メッセージを入力" autocomplete="off">
  <button id="send" disabled>送信</button>
</div><div id="status"></div></div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
// オフライン対応：アプリの殻をサービスワーカーでキャッシュする（機内モードでも開けるように）
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
<script>
// ===== 設定 =====
// モデルは Hugging Face 上の単一ファイル model.onnx を URL で読み込む。
const MODEL_URL = "https://huggingface.co/tamasann/ochako-v3/resolve/main/model.onnx";
const CACHE_NAME = "ochako-model-v1";
const VOCAB_URL = "vocab.json";
// B1.5（製品標準デコード）
const TEMPERATURE = 0.65, TOP_K = 40, REP_PENALTY = 1.15, MAX_NEW = 150, MAX_SEQ = 512;
const PAD = 0, BOS = 1, EOS = 2;

let itos = [], stoi = new Map(), session = null;
const logEl = document.getElementById('log'), inp = document.getElementById('inp'),
      sendBtn = document.getElementById('send'), statusEl = document.getElementById('status'),
      setupEl = document.getElementById('setup'), setupStatusEl = document.getElementById('setupStatus'),
      startBtn = document.getElementById('start'), delBtn = document.getElementById('delcache');

function addMsg(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  logEl.appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d;
}
// 乱数（シード付き、再現性のため生成ごとにランダムシード）
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

async function downloadWithProgress() {
  const r = await fetch(MODEL_URL);
  if (!r.ok) throw new Error("モデルの取得に失敗しました (" + r.status + ")");
  const total = Number(r.headers.get("Content-Length")) || 270367948;
  const reader = r.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    setupStatusEl.textContent = `ダウンロード中… ${(got / 1048576).toFixed(0)}MB / ${(total / 1048576).toFixed(0)}MB`;
  }
  const merged = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { merged.set(c, off); off += c.length; }
  return merged;
}

async function loadModelBytes() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  if (mode === "cache" && "caches" in window) {
    const cache = await caches.open(CACHE_NAME);
    const hit = await cache.match(MODEL_URL);
    if (hit) {
      setupStatusEl.textContent = "保存済みモデルを使います（ダウンロードなし）";
      return new Uint8Array(await hit.arrayBuffer());
    }
    const bytes = await downloadWithProgress();
    try {
      await cache.put(MODEL_URL, new Response(bytes, { headers: { "Content-Type": "application/octet-stream" } }));
      setupStatusEl.textContent = "保存しました。次回からはダウンロードなしで使えます。";
    } catch (e) {
      setupStatusEl.textContent = "保存はできませんでしたが、今回はこのまま使えます。（端末の空き容量不足の可能性があります）";
    }
    return bytes;
  }
  return downloadWithProgress();
}

async function refreshCacheUI() {
  if (!("caches" in window)) return;
  const cache = await caches.open(CACHE_NAME);
  const hit = await cache.match(MODEL_URL);
  if (hit) {
    setupStatusEl.textContent = "この端末に保存済みのモデルがあります。「ブラウザに保存して使う」のままで開始すると、ダウンロードなしで使えます。";
    delBtn.style.display = "inline-block";
  } else {
    delBtn.style.display = "none";
  }
}
delBtn.onclick = async () => {
  await caches.delete(CACHE_NAME);
  setupStatusEl.textContent = "保存済みモデルを削除しました。";
  delBtn.style.display = "none";
};

let started = false;
startBtn.onclick = async () => {
  if (started) return; started = true; startBtn.disabled = true;
  try {
    const v = await (await fetch(VOCAB_URL)).json();
    itos = v.itos;
    itos.forEach((c, i) => { if (c !== null && c !== undefined) stoi.set(c, i); });
    ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);
    const modelBytes = await loadModelBytes();
    setupStatusEl.textContent = "モデルを準備しています…";
    session = await ort.InferenceSession.create(modelBytes, { executionProviders: ['wasm'] });
    setupEl.style.display = "none";
    statusEl.textContent = '準備できました。話しかけてみてください。';
    sendBtn.disabled = false; inp.focus();
  } catch (e) {
    setupStatusEl.textContent = '読み込みに失敗しました: ' + e.message;
    started = false; startBtn.disabled = false;
  }
};
refreshCacheUI();

async function generate(promptText) {
  const rand = mulberry32((Math.random() * 2 ** 31) | 0);
  let ids = [BOS];
  for (const ch of promptText) if (stoi.has(ch)) ids.push(stoi.get(ch));
  const outIds = [];
  for (let step = 0; step < MAX_NEW; step++) {
    const ctx = ids.slice(-MAX_SEQ);
    const input = new ort.Tensor('int64', BigInt64Array.from(ctx.map(BigInt)), [1, ctx.length]);
    const res = await session.run({ idx: input });
    const logits = res.logits.data; // [1, T, V]
    const V = itos.length, off = (ctx.length - 1) * V;
    let last = Array.from(logits.slice(off, off + V));
    // repetition penalty 1.15（出現済みトークンに適用）
    const seen = new Set(ids.slice(1));
    for (const t of seen) { if (last[t] > 0) last[t] /= REP_PENALTY; else last[t] *= REP_PENALTY; }
    // temperature
    for (let i = 0; i < V; i++) last[i] /= TEMPERATURE;
    // top-k 40
    const sorted = [...last].sort((a, b) => b - a);
    const thresh = sorted[Math.min(TOP_K, V) - 1];
    let max = -Infinity; for (let i = 0; i < V; i++) if (last[i] >= thresh && last[i] > max) max = last[i];
    let sum = 0; const probs = new Float64Array(V);
    for (let i = 0; i < V; i++) { if (last[i] >= thresh) { probs[i] = Math.exp(last[i] - max); sum += probs[i]; } }
    let r = rand() * sum, nxt = EOS;
    for (let i = 0; i < V; i++) { if (probs[i] > 0) { r -= probs[i]; if (r <= 0) { nxt = i; break; } } }
    if (nxt === EOS) break;
    outIds.push(nxt); ids.push(nxt);
    const text = outIds.map(i => itos[i] ?? '').join('');
    if (text.includes('\nユーザー') || text.includes('\nあなた：')) break;
  }
  let text = outIds.map(i => itos[i] ?? '').join('');
  for (const m of ['\nユーザー', '\nあなた：']) { const p = text.indexOf(m); if (p >= 0) text = text.slice(0, p); }
  return text.trim();
}

sendBtn.onclick = async () => {
  const text = inp.value.trim(); if (!text || !session) return;
  inp.value = ''; addMsg(text, 'user'); sendBtn.disabled = true;
  const bubble = addMsg('考え中…', 'bot');
  try { bubble.textContent = await generate(text) || '（応答が生成できませんでした）'; }
  catch (e) { bubble.textContent = 'エラー: ' + e.message; }
  sendBtn.disabled = false; inp.focus();
};
inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.onclick(); });
</script>
</body>
</html>
