<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おちゃこAI（ブラウザ版）</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", sans-serif; background:#f7f5f2; color:#1f1e1c; }
  header { padding:14px 16px; background:#fff; border-bottom:1px solid #e5e1da; font-weight:700; }
  header small { display:block; font-weight:400; color:#6b675f; margin-top:2px; }
  #log { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.6; max-width:85%; }
  .user { background:#e8f0e9; align-self:flex-end; }
  .bot { background:#fff; border:1px solid #e5e1da; align-self:flex-start; }
  #bar { position:sticky; bottom:0; background:#f7f5f2; padding:12px 16px; }
  #bar div { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  #inp { flex:1; padding:12px; border-radius:12px; border:1px solid #cfc9bf; font-size:16px; }
  #send { padding:12px 20px; border-radius:12px; border:0; background:#2f6f4f; color:#fff; font-size:16px; }
  #send:disabled { opacity:.5; }
  #status { max-width:760px; margin:8px auto 0; font-size:13px; color:#6b675f; }
</style>
</head>
<body>
<header>おちゃこAI（ブラウザ版）<small>自作Transformer（約6,360万パラメータ）をブラウザ上だけで動かしています。step 189,910 / デコード条件 B1.5</small></header>
<div id="log"></div>
<div id="bar"><div>
  <input id="inp" placeholder="メッセージを入力" autocomplete="off">
  <button id="send" disabled>送信</button>
</div><div id="status">モデルを読み込んでいます…（約258MB、初回は時間がかかります）</div></div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
// ===== 設定 =====
// モデルは Hugging Face 上に16MBずつ分割して配置（model.onnx.part00 〜 part16、計17個）。
// 読み込み時に全パートを取得して結合し、1つのONNXモデルとして使う。
const MODEL_BASE = "https://huggingface.co/tamasann/ochako-v3/resolve/main/";
const MODEL_PARTS = 17;
const VOCAB_URL = "vocab.json";
// B1.5（製品標準デコード）
const TEMPERATURE = 0.65, TOP_K = 40, REP_PENALTY = 1.15, MAX_NEW = 150, MAX_SEQ = 512;
const PAD = 0, BOS = 1, EOS = 2;

let itos = [], stoi = new Map(), session = null;
const logEl = document.getElementById('log'), inp = document.getElementById('inp'),
      sendBtn = document.getElementById('send'), statusEl = document.getElementById('status');

function addMsg(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  logEl.appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d;
}
// 乱数（シード付き、再現性のため生成ごとにランダムシード）
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

async function fetchModel() {
  // 全パートを並行取得して結合する（進捗を status に表示）
  const bufs = new Array(MODEL_PARTS);
  let done = 0;
  await Promise.all(bufs.map(async (_, i) => {
    const name = "model.onnx.part" + String(i).padStart(2, "0");
    const r = await fetch(MODEL_BASE + name);
    if (!r.ok) throw new Error(name + " の取得に失敗しました (" + r.status + ")");
    bufs[i] = new Uint8Array(await r.arrayBuffer());
    done++;
    statusEl.textContent = `モデルを読み込んでいます… ${done}/${MODEL_PARTS}（約258MB、初回は時間がかかります）`;
  }));
  const total = bufs.reduce((a, b) => a + b.length, 0);
  const merged = new Uint8Array(total);
  let off = 0;
  for (const b of bufs) { merged.set(b, off); off += b.length; }
  return merged;
}

async function init() {
  const v = await (await fetch(VOCAB_URL)).json();
  itos = v.itos;
  itos.forEach((c, i) => { if (c !== null && c !== undefined) stoi.set(c, i); });
  ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);
  const modelBytes = await fetchModel();
  session = await ort.InferenceSession.create(modelBytes, { executionProviders: ['wasm'] });
  statusEl.textContent = '準備できました。話しかけてみてください。';
  sendBtn.disabled = false; inp.focus();
}

async function generate(promptText) {
  const rand = mulberry32((Math.random() * 2 ** 31) | 0);
  let ids = [BOS];
  for (const ch of promptText) if (stoi.has(ch)) ids.push(stoi.get(ch));
  const outIds = [];
  for (let step = 0; step < MAX_NEW; step++) {
    const ctx = ids.slice(-MAX_SEQ);
    const input = new ort.Tensor('int64', BigInt64Array.from(ctx.map(BigInt)), [1, ctx.length]);
    const res = await session.run({ idx: input });
    const logits = res.logits.data; // [1, T, V]
    const V = itos.length, off = (ctx.length - 1) * V;
    let last = Array.from(logits.slice(off, off + V));
    // repetition penalty 1.15（出現済みトークンに適用）
    const seen = new Set(ids.slice(1));
    for (const t of seen) { if (last[t] > 0) last[t] /= REP_PENALTY; else last[t] *= REP_PENALTY; }
    // temperature
    for (let i = 0; i < V; i++) last[i] /= TEMPERATURE;
    // top-k 40
    const sorted = [...last].sort((a, b) => b - a);
    const thresh = sorted[Math.min(TOP_K, V) - 1];
    let max = -Infinity; for (let i = 0; i < V; i++) if (last[i] >= thresh && last[i] > max) max = last[i];
    let sum = 0; const probs = new Float64Array(V);
    for (let i = 0; i < V; i++) { if (last[i] >= thresh) { probs[i] = Math.exp(last[i] - max); sum += probs[i]; } }
    let r = rand() * sum, nxt = EOS;
    for (let i = 0; i < V; i++) { if (probs[i] > 0) { r -= probs[i]; if (r <= 0) { nxt = i; break; } } }
    if (nxt === EOS) break;
    outIds.push(nxt); ids.push(nxt);
    const text = outIds.map(i => itos[i] ?? '').join('');
    if (text.includes('\nユーザー') || text.includes('\nあなた：')) break;
  }
  let text = outIds.map(i => itos[i] ?? '').join('');
  for (const m of ['\nユーザー', '\nあなた：']) { const p = text.indexOf(m); if (p >= 0) text = text.slice(0, p); }
  return text.trim();
}

sendBtn.onclick = async () => {
  const text = inp.value.trim(); if (!text || !session) return;
  inp.value = ''; addMsg(text, 'user'); sendBtn.disabled = true;
  const bubble = addMsg('考え中…', 'bot');
  try { bubble.textContent = await generate(text) || '（応答が生成できませんでした）'; }
  catch (e) { bubble.textContent = 'エラー: ' + e.message; }
  sendBtn.disabled = false; inp.focus();
};
inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.onclick(); });
init().catch(e => { statusEl.textContent = '読み込みに失敗しました: ' + e.message; });
</script>
</body>
</html>
